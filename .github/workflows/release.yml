name: Publish unsigned experimental release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile only
        shell: pwsh
        run: ./Build.ps1
      - name: Check metadata and unsigned status
        shell: pwsh
        run: |
          $exe = Get-Item build/KullanimGostergesi.exe
          $exe.VersionInfo | Format-List ProductName,ProductVersion,FileVersion
          if ($exe.VersionInfo.ProductName -ne 'Mini Kota Göstergesi' -or $exe.VersionInfo.ProductVersion -ne '1.0.2.0' -or $exe.VersionInfo.FileVersion -ne '1.0.2.0') { throw 'Unexpected metadata' }
          if ((Get-AuthenticodeSignature $exe.FullName).Status -ne 'NotSigned') { throw 'Unexpected signature status' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          "$hash  KullanimGostergesi.exe" | Set-Content build/SHA256SUMS.txt -Encoding ascii
          "Source commit: $env:GITHUB_SHA" | Add-Content RELEASE-DRAFT.md
          "Build run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content RELEASE-DRAFT.md
      - name: Publish prerelease without executing application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 --target $env:GITHUB_SHA --prerelease --title 'Mini Kota 1.0.2 — unsigned experimental' --notes-file RELEASE-DRAFT.md build/KullanimGostergesi.exe build/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
